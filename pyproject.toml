[project]
name = "cosmic-bytes"
version = "1.0.0"
description = "Robot Task Sequencer — OpenEnv RL Environment"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.1",
    "pydantic>=2.7.1",
    "openai>=1.30.1",
    "httpx>=0.27.0",
    "pillow>=10.3.0",
    "python-multipart>=0.0.9",
    "openenv-core[core]>=0.2.2",
    "dotenv>=0.9.9",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[project.scripts]
server = "server.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
